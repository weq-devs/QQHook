name: Build TXHook

on:
  # 手动触发；或推送 v* 标签自动构建并发布 Release
  # 注意：普通 commit 的 push 不会触发（构建太慢，按需跑）
  workflow_dispatch:
    inputs:
      release:
        description: '构建后创建 Release（需配合 tag 或手动指定版本号）'
        required: false
        type: boolean
        default: false
      tag:
        description: 'Release 标签（如 v3.3.1，留空则不发布）'
        required: false
        type: string
  push:
    tags: [ 'v*' ]

jobs:
  build:
    name: Build CI
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'true'
          fetch-depth: 0

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cache-${{ runner.os }}-${{ hashFiles('gradle-wrapper.properties','gradle.properties','gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-cache-${{ runner.os }}-

      - name: set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          mkdir -p "$ANDROID_HOME/licenses/"
          echo > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -n 24333f8a63b6825ea9c5514f83c2829b004d1fee > "$ANDROID_HOME/licenses/android-sdk-license"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "cmake;3.31.0"
          echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build with Gradle
        run: |
          echo 'org.gradle.parallel=true' >> gradle.properties
          echo 'org.gradle.vfs.watch=true' >> gradle.properties
          sed -i 's/org.gradle.configuration-cache=true//g' gradle.properties
          echo ${{ secrets.SIGN_KEYSTORE_BASE64 }} | base64 -d > keystore.jks
          chmod +x ./gradlew
          # 先跑单元测试（纯逻辑：协议解析 / 收发合并），失败则不打包
          ./gradlew :app:testDebugUnitTest
          ./gradlew :app:assembleRelease
          echo "APK_FILE=$(find app/build/outputs/apk/release -iname '*.apk' | head -n1)" >> $GITHUB_ENV
        env:
          KEYSTORE_PATH: "../keystore.jks"
          KEYSTORE_PASSWORD: ${{ secrets.SIGN_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGN_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGN_KEY_PASSWORD }}

      - name: Show Artifacts SHA256
        run: |
          echo "### Build Success :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "|ABI|SHA256|" >> $GITHUB_STEP_SUMMARY
          echo "|:--------:|:----------|" >> $GITHUB_STEP_SUMMARY
          app=($(sha256sum ${{ env.APK_FILE }}))
          echo "|app|$app" >> $GITHUB_STEP_SUMMARY

      - name: Upload Artifacts(arm64)
        uses: actions/upload-artifact@v4
        with:
          path: ${{ env.APK_FILE }}
          name: TXHook-apk

  release:
    name: Publish Release
    needs: build
    # push tag → 自动发布；手动触发 → 勾选 release 且填了 tag 才发布
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.release && inputs.tag != '') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download APK
        uses: actions/download-artifact@v5
        with:
          name: TXHook-apk
          path: release

      - name: List artifacts
        run: ls -la release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: release/*.apk
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          name: ${{ inputs.tag || github.ref_name }}
