name: Build TXHook

on:
  # 手动触发；或推送 v* 标签自动构建并发布 Release
  # 注意：普通 commit 的 push 不会触发（构建太慢，按需跑）
  workflow_dispatch:
    inputs:
      release:
        description: '构建后创建 Release（需配合 tag 或手动指定版本号）'
        required: false
        type: boolean
        default: false
      tag:
        description: 'Release 标签（如 v3.3.1，留空则不发布）'
        required: false
        type: string
  push:
    tags: [ 'v*' ]

jobs:
  build:
    name: Build CI
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'true'
          fetch-depth: 0

      - name: Resolve version
        id: version
        # 版本号以 tag 为准：推送 tag → 用 tag 名；手动触发 → 用输入的 tag，
        # 没填就取最近一个 tag。build.gradle.kts 里的 versionName 前缀是硬编码的，
        # 下一步会按这里的结果覆盖。
        run: |
          if [ -n "$INPUT_TAG" ]; then
            VERSION="$INPUT_TAG"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)"
          fi
          echo "APP_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "构建版本：${VERSION}"
        env:
          INPUT_TAG: ${{ inputs.tag }}

      - name: Apply version to build script
        # 只改 versionName 的版本前缀，保留「-<提交数>-<短hash>」后缀，
        # 这样调试时仍能从版本名看出对应哪次提交。
        run: |
          python3 - <<'PY'
          import os, pathlib, re, sys

          version = os.environ["APP_VERSION"].strip()
          if not version:
              sys.exit("APP_VERSION 为空")

          path = pathlib.Path("build.gradle.kts")
          src = path.read_text(encoding="utf-8")
          new, count = re.subn(
              r'versionName = "v[^"]*\$count-\$hash"',
              f'versionName = "{version}-$count-$hash"',
              src,
          )
          if count != 1:
              sys.exit(f"versionName 替换失败（匹配 {count} 处），请检查 build.gradle.kts")
          path.write_text(new, encoding="utf-8")
          print(f"versionName -> {version}-$count-$hash")
          PY
          grep -n 'versionName =' build.gradle.kts

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cache-${{ runner.os }}-${{ hashFiles('gradle-wrapper.properties','gradle.properties','gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-cache-${{ runner.os }}-

      - name: set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          mkdir -p "$ANDROID_HOME/licenses/"
          echo > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -n 24333f8a63b6825ea9c5514f83c2829b004d1fee > "$ANDROID_HOME/licenses/android-sdk-license"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "cmake;3.31.0"
          echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build with Gradle
        run: |
          echo 'org.gradle.parallel=true' >> gradle.properties
          echo 'org.gradle.vfs.watch=true' >> gradle.properties
          sed -i 's/org.gradle.configuration-cache=true//g' gradle.properties
          echo ${{ secrets.SIGN_KEYSTORE_BASE64 }} | base64 -d > keystore.jks
          chmod +x ./gradlew
          # 先跑单元测试（纯逻辑：协议解析 / 收发合并），失败则不打包
          ./gradlew :app:testDebugUnitTest
          ./gradlew :app:assembleRelease
          echo "APK_FILE=$(find app/build/outputs/apk/release -iname '*.apk' | head -n1)" >> $GITHUB_ENV
        env:
          KEYSTORE_PATH: "../keystore.jks"
          KEYSTORE_PASSWORD: ${{ secrets.SIGN_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGN_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGN_KEY_PASSWORD }}

      - name: Show Artifacts SHA256
        run: |
          echo "### Build Success :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "|ABI|SHA256|" >> $GITHUB_STEP_SUMMARY
          echo "|:--------:|:----------|" >> $GITHUB_STEP_SUMMARY
          app=($(sha256sum ${{ env.APK_FILE }}))
          echo "|app|$app" >> $GITHUB_STEP_SUMMARY

      - name: Upload Artifacts(arm64)
        uses: actions/upload-artifact@v4
        with:
          path: ${{ env.APK_FILE }}
          name: TXHook-apk

  release:
    name: Publish Release
    needs: build
    # push tag → 自动发布；手动触发 → 勾选 release 且填了 tag 才发布
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.release && inputs.tag != '') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download APK
        uses: actions/download-artifact@v5
        with:
          name: TXHook-apk
          path: release

      - name: List artifacts
        run: ls -la release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: release/*.apk
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          name: ${{ inputs.tag || github.ref_name }}
